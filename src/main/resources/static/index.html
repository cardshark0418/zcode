<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>zcode</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --user: #243447;
      --bot: #1e2a3a;
      --border: #2a3a4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2a44, var(--bg));
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 24px;
    }
    .app {
      width: min(840px, 100%);
      height: calc(100vh - 48px);
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
    }
    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
    }
    .msg.error {
      align-self: stretch;
      background: #3a1f24;
      border: 1px solid #7a3038;
      color: #ffc9cf;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--border);
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 52px;
      max-height: 140px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #121a26;
      color: var(--text);
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 0 18px;
      background: var(--accent);
      color: white;
      font: inherit;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>zcode</h1>
      <p>最小对话骨架 · 无记忆 · 无工具</p>
    </header>
    <div id="messages"></div>
    <form id="chat-form">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="2"></textarea>
      <button type="submit" id="send">发送</button>
    </form>
  </div>
  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");

    function appendMessage(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      appendMessage("user", message);
      input.value = "";
      sendBtn.disabled = true;

      const pending = appendMessage("assistant", "思考中…");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        if (!res.ok) {
          pending.className = "msg error";
          pending.textContent = data.error || ("请求失败: " + res.status);
        } else {
          pending.textContent = data.reply || "(空回复)";
        }
      } catch (err) {
        pending.className = "msg error";
        pending.textContent = String(err);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
