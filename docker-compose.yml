# Local Qdrant for zcode code_search (semantic index).
# Usage:
#   docker compose up -d
#   docker compose down
#
# API:  http://127.0.0.1:6333
# Dashboard: http://127.0.0.1:6333/dashboard
# zcode default: ZCODE_QDRANT_URL=http://127.0.0.1:6333

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: zcode-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC (optional)
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
